controller:
  adminUser: admin
  adminPassword: "${ADMIN_PASSWORD}" # замінити через Helm set або Secret
  serviceType: ClusterIP

  JCasC:
    enabled: true

  kubernetes:
    enabled: true
    namespace: "jenkins"
    jenkinsUrl: "http://jenkins:8080"

  podTemplates:
    - name: kaniko
      label: kaniko
      # образ з контейнерами, як у Jenkinsfile
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          command: ["/kaniko/executor"]
        - name: awscli
          image: amazon/aws-cli:2.9.0
        - name: git
          image: alpine/git:latest
  serviceAccount:
    create: true
controller:
  admin:
    username: admin
    password: admin123

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: true
    storageClass: "ebs-sc"
    size: 10Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  serviceAccount:
    name: jenkins-sa
    create: false

  JCasC:
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: ${github_user}
                      password: ${github_pat}
                      description: GitHub PAT
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('${github_repo_url}')
                      credentials('github-token')
                    }
                    branches('*/lesson-9')
                  }
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${github_repo_url}")
                                  credentials("github-token")
                                }
                                branches("*/lesson-9")
                              }
                            }
                          }
                        }
                      }
                    ''')
                  }
                }
              }