controller:
  # --- Admin credentials ---
  adminUser: admin
  adminPassword: "${ADMIN_PASSWORD}"  # замінити через Helm set або Secret
  admin:
    username: admin
    password: admin123

  # --- Service configuration ---
  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  # --- Kubernetes integration ---
  kubernetes:
    enabled: true
    namespace: "jenkins"
    jenkinsUrl: "http://jenkins:8080"

  # --- Pod templates (Kaniko + helpers) ---
  podTemplates:
    - name: kaniko
      label: kaniko
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          command: ["/kaniko/executor"]
        - name: awscli
          image: amazon/aws-cli:2.9.0
        - name: git
          image: alpine/git:latest

  # --- Resources ---
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  # --- Persistent volume ---
  persistentVolume:
    enabled: true
    storageClass: "ebs-sc"
    size: 10Gi

  # --- Plugins to install ---
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  # --- Use our pre-created ServiceAccount with IRSA ---
  serviceAccount:
    name: jenkins-kaniko-sa
    create: false

  # --- Jenkins Configuration-as-Code ---
  JCasC:
    enabled: true
    configScripts:

      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: ${github_user}
                      password: ${github_pat}
                      description: GitHub PAT

      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('${github_repo_url}')
                      credentials('github-token')
                    }
                    branches('*/lesson-9')
                  }
                }
                steps {
                  dsl {
                    text('''

                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("${github_repo_url}")
                                  credentials("github-token")
                                }
                                branches("*/lesson-9")
                              }
                            }
                          }
                        }
                      }

                    ''')
                  }
                }
              }
